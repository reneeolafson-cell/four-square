name: Publish web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install, check, and build
        working-directory: source
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Check out published files
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Update published files
        run: |
          git -C published rm -r --ignore-unmatch .
          cp -R source/dist/. published/
          touch published/.nojekyll
          git -C published add -A
          if git -C published diff --cached --quiet; then
            echo 'The published build is already up to date.'
            exit 0
          fi
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published commit -m 'Publish Four Square web preview'
          git -C published push origin gh-pages
